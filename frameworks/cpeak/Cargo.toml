[package]
name = "httparena-cpeak"
version = "0.1.0"
edition = "2021"

[dependencies]
cpeak = { version = "0.4.0", default-features = false, features = ["preserve_order"] }
#mimalloc = { version = "0.1", default-features = false, features = ["v2"] }
mimalloc = { git = "https://github.com/dyu/mimalloc_rust.git", branch = "legacy", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only for GET /async-db
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }

[profile.release]
codegen-units = 1
lto = "fat"